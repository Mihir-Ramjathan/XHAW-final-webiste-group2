<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="js/app.js" defer></script>
</head>
<body>

<div class="app website">

    <header class="app-header">
        <div class="logo"><img src="logo.png" alt="Pawsitive Pet Academy logo" class="header-logo"><span>PAWSITIVE PET ACADEMY</span></div>
        <nav class="site-nav" aria-label="Main navigation"><a href="02-home.html">Home</a><a href="03-about.html">About</a><a href="04-courses.html">Courses</a><a href="06-select-courses.html">Select Courses</a><a href="07-my-selection.html">My Selection</a><a href="08-fees.html">Fees</a><a href="09-request-quote.html" aria-current="page">Request Quote</a><a href="10-enquiry.html">Enquiry</a><a href="11-contact.html">Contact</a></nav>
    </header>

    <main class="content page-request-quote">
        <div id="page-error" class="error-message" hidden role="alert"></div>

        <h1>Request a Quote</h1>

        <p>Please select your courses before submitting a quote request.</p>
<form data-form-type="quote">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required minlength="2" maxlength="100" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required maxlength="120" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required maxlength="20" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required minlength="10" maxlength="1000" placeholder="Tell us what you need"></textarea>
            </div>

            <button type="submit" class="button">Submit Request</button>

        </form>

    </main>

</div>

</body>
</html>
